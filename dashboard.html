<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AM PRO — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-brand">
    <div class="brand-icon"><i data-lucide="shield"></i></div>
    <div>
      <div class="brand-badge">ADMIN</div>
      <span class="nav-title">AM PRO Control</span>
    </div>
  </div>
  <div class="nav-right">
    <div class="admin-info">
      <i data-lucide="user-circle-2"></i>
      <span id="adminName">—</span>
    </div>
    <button class="icon-btn danger" id="logoutBtn" title="خروج">
      <i data-lucide="log-out"></i>
    </button>
  </div>
</nav>

<!-- GATE -->
<div id="gate" class="gate">
  <div class="spinner"></div>
  <p>جارٍ التحقق من الصلاحيات...</p>
</div>

<!-- MAIN -->
<main id="main" class="hidden">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card blue">
      <div class="stat-icon"><i data-lucide="users"></i></div>
      <div class="stat-info">
        <span id="sMembers">0</span>
        <label>عضو مسجل</label>
      </div>
    </div>
    <div class="stat-card green">
      <div class="stat-icon"><i data-lucide="check-square"></i></div>
      <div class="stat-info">
        <span id="sTasks">0</span>
        <label>تاسك نشط</label>
      </div>
    </div>
    <div class="stat-card orange">
      <div class="stat-icon"><i data-lucide="bar-chart-2"></i></div>
      <div class="stat-info">
        <span id="sAvg">0</span>
        <label>متوسط المستوى</label>
      </div>
    </div>
    <div class="stat-card purple">
      <div class="stat-icon"><i data-lucide="trophy"></i></div>
      <div class="stat-info">
        <span id="sMaxRank">—</span>
        <label>أعلى رانك</label>
      </div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <i data-lucide="search"></i>
      <input type="text" id="searchInput" placeholder="ابحث بالاسم أو اليوزر..." oninput="filterTable()"/>
      <span id="searchCount" class="search-count"></span>
    </div>
    <button class="btn-primary" onclick="openGlobalTask()">
      <i data-lucide="plus"></i> تاسك جديد
    </button>
  </div>

  <!-- TABLE -->
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>العضو</th>
          <th>المجال</th>
          <th>الرانك</th>
          <th>المستوى</th>
          <th>تعديل سريع</th>
          <th>التاسكات</th>
          <th>الانضمام</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="tBody">
        <tr><td colspan="8" class="loading-td"><div class="spinner sm"></div></td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- ══ MODAL: EDIT MEMBER ══ -->
<div id="editModal" class="overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-info">
        <div id="editAvatar" class="avatar lg">?</div>
        <div>
          <h3 id="editTitle">تعديل العضو</h3>
          <div id="editBadge" class="rank-pill sm" style="margin-top:5px">—</div>
        </div>
      </div>
      <button class="icon-btn" onclick="closeModal('editModal')">
        <i data-lucide="x"></i>
      </button>
    </div>

    <div class="modal-body">
      <input type="hidden" id="editId"/>

      <!-- LEVEL SECTION -->
      <div class="section-label">
        <i data-lucide="zap" style="width:13px;height:13px"></i>
        المستوى والرانك
      </div>

      <div class="rank-display-card" id="rankDisplayCard">
        <div class="rank-glow" id="rankGlow"></div>
        <div class="rank-name" id="rankName">—</div>
        <div class="rank-sub" id="rankSubLabel">Sub-Level —</div>
      </div>

      <div class="level-controls">
        <button class="lvl-btn minus" onclick="lvl(-10)">−10</button>
        <button class="lvl-btn minus" onclick="lvl(-1)">−1</button>
        <div class="level-display">
          <span id="lvlNum">1</span>
          <small>Level</small>
        </div>
        <button class="lvl-btn plus" onclick="lvl(+1)">+1</button>
        <button class="lvl-btn plus" onclick="lvl(+10)">+10</button>
      </div>

      <!-- Direct input -->
      <div class="direct-input-row">
        <label>ادخل مستوى مباشر:</label>
        <input type="number" id="directLevel" min="1" placeholder="مثال: 45"
               onchange="setDirectLevel()"/>
      </div>

      <!-- TASKS SECTION -->
      <div class="section-label" style="margin-top:26px">
        <i data-lucide="list-checks" style="width:13px;height:13px"></i>
        التاسكات
        <span id="taskCountBadge" class="count-badge">0</span>
      </div>
      <div id="tasksList" class="tasks-list"></div>
      <div class="add-row">
        <input type="text" id="newTask" placeholder="أضف تاسك جديد..."
               onkeydown="if(event.key==='Enter')addTask()"/>
        <button class="btn-primary sm" onclick="addTask()">
          <i data-lucide="plus"></i>
        </button>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal('editModal')">إغلاق</button>
      <button class="btn-primary" onclick="saveLevel()">
        <i data-lucide="save"></i> حفظ المستوى
      </button>
    </div>
  </div>
</div>

<!-- ══ MODAL: GLOBAL TASK ══ -->
<div id="taskModal" class="overlay hidden">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <h3>إضافة تاسك لعضو</h3>
      <button class="icon-btn" onclick="closeModal('taskModal')">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>اختر العضو</label>
        <select id="taskTarget"></select>
      </div>
      <div class="field" style="margin-top:14px">
        <label>نص التاسك</label>
        <input type="text" id="taskText" placeholder="اكتب التاسك هنا..."
               onkeydown="if(event.key==='Enter')saveGlobalTask()"/>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal('taskModal')">إلغاء</button>
      <button class="btn-primary" onclick="saveGlobalTask()">
        <i data-lucide="plus"></i> إضافة
      </button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="admin.js"></script>
</body>
</html>
