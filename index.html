<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AM PRO — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #000;
      --blue: #007aff;
      --red: #ff453a;
      --text: #f5f5f7;
      --dim: #6e6e73;
      --stroke: rgba(255,255,255,.1);
      --surface: rgba(255,255,255,.04);
      --surface-hover: rgba(255,255,255,.07);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Atmospheric background */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-1 {
      width: 600px; height: 600px;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(0,122,255,.12), transparent 70%);
      animation: drift1 8s ease-in-out infinite alternate;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      bottom: -100px; right: -100px;
      background: radial-gradient(circle, rgba(88,86,214,.08), transparent 70%);
      animation: drift2 10s ease-in-out infinite alternate;
    }
    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    }

    @keyframes drift1 { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-30px); } }
    @keyframes drift2 { from { transform: translateY(0); } to { transform: translateY(-20px); } }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      animation: appear .5s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(28px) scale(.97); } }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 60px; height: 60px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #007aff, #5856d6);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(0,122,255,.35), 0 8px 30px rgba(0,0,0,.5);
    }
    .logo-icon i { width: 28px; height: 28px; color: #fff; }
    .logo h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #f5f5f7, #8e8e93);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo .sub {
      font-size: 13px;
      color: var(--dim);
      margin-top: 4px;
      font-weight: 400;
    }
    .admin-badge {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      font-weight: 600;
      color: var(--red);
      border: 1px solid rgba(255,69,58,.3);
      background: rgba(255,69,58,.07);
      border-radius: 30px;
      padding: 4px 12px;
      margin-bottom: 14px;
    }

    .box {
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--dim);
      font-weight: 600;
      letter-spacing: .8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .iw {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 13px;
      padding: 0 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    .iw:focus-within {
      border-color: rgba(0,122,255,.6);
      box-shadow: 0 0 0 3px rgba(0,122,255,.12);
    }
    .iw i { color: var(--dim); width: 16px; height: 16px; flex-shrink: 0; }
    .iw input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      padding: 13px 0;
      direction: ltr;
      text-align: left;
    }
    .iw input::placeholder { color: rgba(255,255,255,.2); }
    .eye {
      background: none; border: none;
      color: var(--dim); cursor: pointer;
      display: flex; align-items: center;
      padding: 2px; transition: color .15s;
    }
    .eye:hover { color: var(--text); }
    .eye i { width: 15px; height: 15px; }

    .btn {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 13px;
      font-family: 'Tajawal', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,122,255,.35);
    }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn i { width: 17px; height: 17px; }

    .err {
      display: none;
      text-align: center;
      color: var(--red);
      font-size: 13px;
      margin-top: 14px;
      padding: 10px 16px;
      background: rgba(255,69,58,.07);
      border: 1px solid rgba(255,69,58,.2);
      border-radius: 10px;
    }
    .err.show { display: block; animation: shake .3s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .foot {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.15);
      margin-top: 20px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-grid"></div>

<div class="card">
  <div class="logo">
    <div class="admin-badge">ADMIN PANEL</div>
    <div class="logo-icon"><i data-lucide="shield"></i></div>
    <h1>AM PRO</h1>
    <p class="sub">لوحة تحكم المشرف</p>
  </div>

  <div class="box">
    <div class="field">
      <label>اسم المستخدم</label>
      <div class="iw">
        <i data-lucide="user"></i>
        <input type="text" id="u" placeholder="Admin username" autocomplete="off"/>
      </div>
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <div class="iw">
        <i data-lucide="lock"></i>
        <input type="password" id="p" placeholder="••••••••" autocomplete="off"
               onkeydown="if(event.key==='Enter')go()"/>
        <button class="eye" onclick="toggleEye(this)" type="button">
          <i data-lucide="eye"></i>
        </button>
      </div>
    </div>
    <button class="btn" id="btn" onclick="go()">
      <i data-lucide="shield-check"></i> دخول
    </button>
    <div class="err" id="err">اسم المستخدم أو كلمة المرور غلط</div>
  </div>

  <div class="foot">AM PRO Admin v3.0</div>
</div>

<script>
  lucide.createIcons();
  const { createClient } = supabase;
  const sb = createClient(
    "https://tzojjwnqodcrhwjaasja.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6b2pqd25xb2Rjcmh3amFhc2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NzA2ODAsImV4cCI6MjA5MzI0NjY4MH0.G4IGSUgjVIKTNVszU5GpxNaD0VUnSmzUXe8p7uUl418"
  );

  function toggleEye(btn) {
    const inp = btn.closest('.iw').querySelector('input');
    const ic  = btn.querySelector('i');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ic.setAttribute('data-lucide', inp.type === 'password' ? 'eye' : 'eye-off');
    lucide.createIcons();
  }

  async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function go() {
    const btn  = document.getElementById('btn');
    const err  = document.getElementById('err');
    const user = document.getElementById('u').value.trim();
    const pass = document.getElementById('p').value;
    err.classList.remove('show');
    if (!user || !pass) { err.textContent = 'اكتب اسم المستخدم وكلمة المرور'; err.classList.add('show'); return; }
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2"></i> جارٍ التحقق...';
    lucide.createIcons();
    const hash = await sha256(pass);
    const { data, error } = await sb.from('admins').select('id,username')
      .eq('username', user).eq('password_hash', hash).maybeSingle();
    if (error || !data) {
      err.textContent = 'اسم المستخدم أو كلمة المرور غلط';
      err.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="shield-check"></i> دخول';
      lucide.createIcons();
      return;
    }
    sessionStorage.setItem('am_admin_id', data.id);
    sessionStorage.setItem('am_admin_user', data.username);
    window.location.href = 'dashboard.html';
  }
</script>
</body>
</html>
