<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AM PRO — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{--bg:#000;--surface:rgba(255,255,255,.05);--stroke:rgba(255,255,255,.08);--blue:#007aff;--red:#ff453a;--text:#f5f5f7;--dim:#86868b;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
    body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0%,#0a0a20,#000 65%);}
    body::after{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;}
    .card{width:100%;max-width:400px;padding:20px;animation:up .4s cubic-bezier(.2,.8,.2,1) both;}
    @keyframes up{from{opacity:0;transform:translateY(22px)}}
    .logo{text-align:center;margin-bottom:28px;}
    .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:3px;font-weight:600;color:var(--red);border:1px solid rgba(255,69,58,.3);background:rgba(255,69,58,.08);border-radius:6px;padding:4px 12px;margin-bottom:12px;}
    .logo h1{font-size:30px;font-weight:900;letter-spacing:-1px;}
    .logo p{font-size:13px;color:var(--dim);margin-top:5px;}
    .box{background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:20px;padding:28px;}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.5px;margin-bottom:8px;}
    .iw{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:12px;padding:0 14px;transition:border-color .2s;}
    .iw:focus-within{border-color:var(--blue);}
    .iw i{color:var(--dim);width:16px;height:16px;flex-shrink:0;}
    .iw input{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;padding:13px 0;direction:ltr;text-align:left;}
    .iw input::placeholder{color:var(--dim);}
    .eye{background:none;border:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;padding:2px;}
    .eye:hover{color:var(--text);}
    .eye i{width:16px;height:16px;}
    .btn{width:100%;margin-top:6px;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn:hover{opacity:.85;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn i{width:17px;height:17px;}
    .err{display:none;text-align:center;color:var(--red);font-size:13px;margin-top:14px;padding:10px;background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.2);border-radius:10px;}
    .err.show{display:block;}
    .foot{text-align:center;font-size:12px;color:var(--dim);margin-top:18px;font-family:'IBM Plex Mono',monospace;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="badge">ADMIN PANEL</div>
    <h1>AM PRO</h1>
    <p>لوحة تحكم المشرف</p>
  </div>
  <div class="box">
    <div class="field">
      <label>اسم المستخدم</label>
      <div class="iw">
        <i data-lucide="user"></i>
        <input type="text" id="u" placeholder="Admin username" autocomplete="off"/>
      </div>
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <div class="iw">
        <i data-lucide="lock"></i>
        <input type="password" id="p" placeholder="••••••••" autocomplete="off" onkeydown="if(event.key==='Enter')go()"/>
        <button class="eye" onclick="toggleEye(this)" type="button"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <button class="btn" id="btn" onclick="go()">
      <i data-lucide="shield-check"></i> دخول
    </button>
    <div class="err" id="err">اسم المستخدم أو كلمة المرور غلط</div>
  </div>
  <div class="foot">AM PRO Admin v2.0</div>
</div>
<script>
  lucide.createIcons();
  const {createClient}=supabase;
  const sb=createClient(
    "https://tzojjwnqodcrhwjaasja.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR6b2pqd25xb2Rjcmh3amFhc2phIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NzA2ODAsImV4cCI6MjA5MzI0NjY4MH0.G4IGSUgjVIKTNVszU5GpxNaD0VUnSmzUXe8p7uUl418"
  );

  function toggleEye(btn){
    var inp=btn.closest('.iw').querySelector('input');
    var ic=btn.querySelector('i');
    inp.type=inp.type==='password'?'text':'password';
    ic.setAttribute('data-lucide',inp.type==='password'?'eye':'eye-off');
    lucide.createIcons();
  }

  async function sha256(msg){
    var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function go(){
    var btn=document.getElementById('btn');
    var err=document.getElementById('err');
    var user=document.getElementById('u').value.trim();
    var pass=document.getElementById('p').value;
    err.classList.remove('show');
    if(!user||!pass){err.textContent='اكتب اسم المستخدم وكلمة المرور';err.classList.add('show');return;}
    btn.disabled=true;
    btn.innerHTML='<i data-lucide="loader"></i> جارٍ التحقق...';
    lucide.createIcons();
    var hash=await sha256(pass);
    var {data,error}=await sb.from('admins').select('id,username').eq('username',user).eq('password_hash',hash).maybeSingle();
    if(error||!data){
      err.textContent='اسم المستخدم أو كلمة المرور غلط';
      err.classList.add('show');
      btn.disabled=false;
      btn.innerHTML='<i data-lucide="shield-check"></i> دخول';
      lucide.createIcons();
      return;
    }
    sessionStorage.setItem('am_admin_id',data.id);
    sessionStorage.setItem('am_admin_user',data.username);
    window.location.href='dashboard.html';
  }
</script>
</body>
</html>
